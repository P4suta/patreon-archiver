name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff + pyright + pytest (cov 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Sync dev deps
        run: uv sync --group dev --frozen

      - name: ruff check
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: pyright (strict)
        run: uv run pyright

      - name: pytest with branch coverage
        run: uv run pytest --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck smoke
        run: |
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.11.0 \
            -x scripts/smoke.sh

  dockerfile:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

  yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: yamllint
        run: |
          docker run --rm -v "$PWD":/data cytopia/yamllint:1 \
            -c /data/.yamllint.yaml --strict /data

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: crate-ci/typos@718c4ff697435edabd4f1c52c3775521adbb33a3 # v1.31.0

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-git

  # The one status check branch protection requires,
  # named the same in every P4suta repository.
  # It passes only when every job it needs succeeded or was skipped.
  required:
    name: required
    if: always()
    needs: [python, shell, dockerfile, yaml, typos, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
