trustedRegistries:
  - docker.io
  - ghcr.io

failure-threshold: error

ignored:
  # DL3008: pin apt-get install versions — debian package versions roll
  # forward inside a release; pinning would require pinning the slim base
  # image too, which Renovate handles separately. Locking transitively
  # via the base image digest is the right level for our use case.
  - DL3008
  # DL3006: tag image explicitly — we use `ARG PYTHON_IMAGE=python:3.13-
  # slim-bookworm` indirection on purpose so Renovate's regex manager can
  # bump it. The ARG default IS a tagged image; hadolint just doesn't
  # follow ARG resolution.
  - DL3006
