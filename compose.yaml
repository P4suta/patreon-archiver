name: patreon-archiver

# Three profiles:
#   * default          — `docker compose run --rm archiver <URL>`        (no cookies)
#   * cookies          — `docker compose --profile cookies run --rm archiver-with-cookies <URL>`
#   * dev              — `docker compose --profile dev run --rm shell`   (interactive bash)

x-archiver-base: &archiver-base
  build:
    context: .
    target: runtime
  image: patreon-archiver:local
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    TZ: ${TZ:-Asia/Tokyo}
    YTDLP_BATCH_SLEEP_MIN: ${YTDLP_BATCH_SLEEP_MIN:-5}
    YTDLP_BATCH_SLEEP_MAX: ${YTDLP_BATCH_SLEEP_MAX:-15}
  volumes:
    - ${DOWNLOAD_DIR:-./downloads}:/downloads
    - ./config:/work/config:ro
    - ./urls:/work/urls:ro

services:
  archiver:
    <<: *archiver-base

  archiver-with-cookies:
    <<: *archiver-base
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      YTDLP_BATCH_SLEEP_MIN: ${YTDLP_BATCH_SLEEP_MIN:-5}
      YTDLP_BATCH_SLEEP_MAX: ${YTDLP_BATCH_SLEEP_MAX:-15}
      YTDLP_COOKIES: /secrets/cookies.txt
    volumes:
      - ${DOWNLOAD_DIR:-./downloads}:/downloads
      - ./config:/work/config:ro
      - ./urls:/work/urls:ro
      - ${COOKIES_FILE:-./secrets/cookies.txt}:/secrets/cookies.txt:ro
    profiles: ["cookies"]

  shell:
    <<: *archiver-base
    entrypoint: ["/bin/bash"]
    command: []
    profiles: ["dev"]
