# NOTE: --paths and --download-archive are NOT set here. download.py supplies
# them per-invocation so every yt-dlp run writes inside /var/lib/pa/staging
# (an internal, container-private directory). Only after all postprocessors
# complete does download.py atomic-rename the finished mp4 into /data, and
# only then is the new entry appended to /data/archive.txt. This guarantees
# /data never sees a partial / mid-merge / mid-embed file even if the run
# is killed (Ctrl-C, OOM, container exit).
#
# This is the *fast* preset — same correctness contract as yt-dlp.conf, with
# the polite throttles loosened to a "browser-aggressive" envelope. CF Stream
# is built to feed ABR players that prefetch 4-8 segments ahead per rendition
# from a single client; the values below stay inside that envelope.
--output           %(uploader)s/%(upload_date>%Y-%m-%d)s_%(title).140B.%(ext)s
--format           bv*+ba/b
--merge-output-format mp4
--remux-video      mp4
# See yt-dlp.conf for the rationale; same selection priority applies.
--format-sort      res,br,proto

# Browser-aggressive pacing.
#   * No --limit-rate: native speed end-to-end.
#   * --concurrent-fragments 8: matches what an HLS player prefetching
#                               4-8 segments ahead would open. Doubling
#                               this beyond ~16 starts to look like a
#                               scraper to CF's per-IP heuristics.
#   * --sleep-requests 0: extractor metadata is at most a couple of HTTP
#                         calls per video; no inter-call spacing needed.
--concurrent-fragments 8
--sleep-requests   0

# Retry policy is identical to the polite preset — if a 429 / 5xx ever
# does fire, exponential backoff is what stops us from making it worse.
--retries          10
--fragment-retries 10
--retry-sleep      fragment:exp=1:60
--retry-sleep      http:exp=1:30
--retry-sleep      extractor:exp=1:30

--continue
--no-overwrites
--embed-metadata
--embed-thumbnail
--no-mtime
--ignore-config

# Progress display: same as the polite preset.
--progress
--progress-delta   5

# Annotate the start of each item so scrollback shows what's happening.
# After download.py's --parse-metadata injection the %(uploader)s and
# %(title)s placeholders carry the curated values from the URL block.
--print "before_dl:[start] %(uploader)s — %(title)s (id=%(id)s)"
--print "after_move:[done]  %(uploader)s — %(title)s -> %(filepath)s"
