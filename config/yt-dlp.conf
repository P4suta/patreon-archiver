# NOTE: --paths and --download-archive are NOT set here. download.py supplies
# them per-invocation so every yt-dlp run writes inside /var/lib/pa/staging
# (an internal, container-private directory). Only after all postprocessors
# complete does download.py atomic-rename the finished mp4 into /data, and
# only then is the new entry appended to /data/archive.txt. This guarantees
# /data never sees a partial / mid-merge / mid-embed file even if the run
# is killed (Ctrl-C, OOM, container exit).
--output           %(uploader)s/%(upload_date>%Y-%m-%d)s_%(title).140B.%(ext)s
--format           bv*+ba/b
--merge-output-format mp4
--remux-video      mp4
# Format selection priority overrides yt-dlp's default protocol-first
# preference. Cloudflare Stream serves the same 1080p source as both HLS
# (~2.4 Mbps) and DASH (~4.3 Mbps); the default sort would pick HLS for
# protocol reasons. With "res,br,proto" we lock onto resolution first,
# then bitrate (so the higher-bitrate DASH rendition wins for the same
# 1080p), then fall through to protocol as a final tiebreak.
--format-sort      res,br,proto

# Polite-but-practical pacing.
#   * No --limit-rate: a single client running at native speed for an hour
#                      is indistinguishable from a 4K viewer to a CDN.
#   * --concurrent-fragments 4: a common-knowledge medium concurrency,
#                               fewer than the parallel TCP streams a
#                               browser opens to a CDN for one page.
#   * --sleep-requests 1: a small pause between extractor metadata calls.
#                         Negligible vs total runtime, hides the burst
#                         pattern from anti-scraping signals.
--concurrent-fragments 4
--sleep-requests   1

--retries          10
--fragment-retries 10
--retry-sleep      fragment:exp=1:60
--retry-sleep      http:exp=1:30
--retry-sleep      extractor:exp=1:30

--continue
--no-overwrites
--embed-metadata
--embed-thumbnail
--no-mtime
--ignore-config

# Progress display:
#   * yt-dlp default = in-place updating bar with percent / speed / ETA /
#     fragment counter (`frag X/Y`) — exactly what you want when watching
#     a long batch interactively. `docker compose run` keeps the TTY.
#   * --progress-delta 5 throttles the emit rate to once per 5 seconds.
#     In a TTY this means the in-place bar refreshes every 5s instead of
#     dozens of times per second; piped to a log it caps the noise.
#   * --newline is a CLI-side override for piping into a log file.
--progress
--progress-delta   5

# Annotate the start of each item so scrollback shows what's happening.
# After download.sh's --parse-metadata injection the %(uploader)s and
# %(title)s placeholders carry the curated values from the URL block.
--print "before_dl:[start] %(uploader)s — %(title)s (id=%(id)s)"
--print "after_move:[done]  %(uploader)s — %(title)s -> %(filepath)s"
